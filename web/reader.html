<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%272%27 y=%271%27 width=%2712%27 height=%2714%27 rx=%272%27 fill=%27%232b5c8e%27/%3E%3Cpath d=%27M5 5h6M5 8h6M5 11h4%27 stroke=%27white%27 stroke-width=%271.3%27/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2b5c8e">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/vendor/fonts/source-serif-4.css">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/reader.css">
  <script defer src="/static/vendor/katex/katex.min.js"></script>
  <script defer src="/static/vendor/katex/contrib/auto-render.min.js"></script>
  <script type="module" src="/static/reader.js"></script>
</head>
<body class="reader">
  <header class="topbar">
    <div class="bar-row">
      <a class="home btn quiet" href="/" title="Library" aria-label="Back to the library">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <details class="menu toc" id="toc">
        <summary title="Jump to a section">
          <span class="short-title" id="short-title">Loading…</span>
          <span class="full-title" id="full-title"></span>
          <svg class="icon caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <nav class="menu-panel" id="toc-list" aria-label="Sections"></nav>
      </details>
      <div class="toggles" role="group" aria-label="View options">
        <label class="switch"><input type="checkbox" id="opt-cites"><span>Citations</span></label>
        <label class="switch"><input type="checkbox" id="opt-follow" checked><span>Auto-follow</span></label>
        <div class="speed" id="speed" hidden>
          <button class="speed-btn" type="button" id="speed-btn" aria-expanded="false" aria-controls="speed-panel"
                  title="Playback speed">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 11.5a6 6 0 1 1 10.8 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="m8 9.6 2.6-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="9.6" r="1.1" fill="currentColor"/></svg>
            <span id="speed-value">1.0×</span>
          </button>
          <div class="menu-panel speed-panel" id="speed-panel" role="group" aria-label="Playback speed" hidden>
            <div class="speed-head">
              <span class="muted">Playback speed</span>
              <output class="speed-out" id="speed-out" for="speed-range">1.0×</output>
              <button class="btn quiet speed-reset" type="button" id="speed-reset" title="Back to normal speed">1×</button>
            </div>
            <div class="speed-row">
              <button class="btn quiet" type="button" id="speed-down" aria-label="Slower by 0.1">−</button>
              <input type="range" id="speed-range" min="0.5" max="2.5" step="0.1" value="1" list="speed-ticks"
                     aria-label="Playback speed">
              <button class="btn quiet" type="button" id="speed-up" aria-label="Faster by 0.1">+</button>
            </div>
            <datalist id="speed-ticks"><option value="0.5"></option><option value="1"></option><option value="1.5"></option><option value="2"></option><option value="2.5"></option></datalist>
          </div>
        </div>
      </div>
      <span class="badge offline-badge" id="offline-badge" title="The server is out of reach: reading the copy saved on this device" hidden>Offline copy</span>
      <div class="offline" id="offline">
        <button class="btn offline-btn" type="button" id="offline-btn">
          <svg class="icon i-save" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.8 7 8 10.2 11.2 7M3 12.5v.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="ol-long" id="offline-long">Save offline</span>
          <span class="ol-short" id="offline-short">Save</span>
        </button>
        <button class="btn quiet offline-cancel" type="button" id="offline-cancel" title="Cancel saving" aria-label="Cancel saving" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="menu-panel offline-panel" id="offline-panel" hidden></div>
      </div>
      <button class="btn primary listen-btn" type="button" id="listen-open">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h2.5L9 3v10L5.5 10H3z" fill="currentColor"/><path d="M11.2 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span id="listen-label">Listen</span>
      </button>
    </div>

    <div class="player" id="player" hidden>
      <button class="btn quiet play" type="button" id="pl-play" aria-label="Play">
        <svg class="icon i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg>
        <svg class="icon i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg>
      </button>
      <button class="btn quiet skip" type="button" id="pl-back" title="Back 15 seconds">−15</button>
      <button class="btn quiet skip" type="button" id="pl-fwd" title="Forward 15 seconds">+15</button>
      <div class="seek-wrap">
        <input class="seek" type="range" id="pl-seek" min="0" max="0" step="0.1" value="0" aria-label="Seek">
        <div class="seek-marks" id="pl-marks" aria-hidden="true"></div>
      </div>
      <button class="time" type="button" id="pl-time" aria-controls="pl-seek" aria-expanded="false"
              title="Show the position slider">0:00 / 0:00</button>
      <select id="pl-run" aria-label="Narration run" hidden></select>
      <button class="btn quiet fs-btn" type="button" id="pl-fullscreen" aria-label="Full screen" title="Full screen" hidden>
        <svg class="icon i-expand" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icon i-collapse" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="panes">
    <div class="text-col">
      <main class="text-pane" id="text-pane" tabindex="-1">
        <article class="paper" id="paper">
          <p class="muted loading">Loading paper…</p>
        </article>
      </main>
      <button class="resume-pill btn primary" type="button" id="resume" hidden>Resume following</button>
    </div>

    <aside class="fig-pane" id="fig-pane" aria-label="Figure">
      <div class="fig-head">
        <button class="fig-collapse btn quiet" type="button" id="fig-collapse" aria-expanded="true" aria-controls="fig-body" title="Show or hide the figure">
          <svg class="icon caret" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="fig-label" id="fig-label">Figures</span>
        <button class="fig-mode" type="button" id="fig-mode" disabled>following scroll</button>
        <span class="fig-nav">
          <button class="btn quiet" type="button" id="fig-prev" aria-label="Previous figure">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="fig-pos" id="fig-pos"></span>
          <button class="btn quiet" type="button" id="fig-next" aria-label="Next figure">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </span>
      </div>
      <div class="fig-body" id="fig-body"></div>
    </aside>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <p class="toast" id="offline-toast" role="status"></p>

  <dialog class="lightbox" id="lightbox" aria-label="Figure image">
    <img id="lightbox-img" alt="">
  </dialog>

  <dialog class="drawer" id="listen" aria-labelledby="listen-title">
    <div class="drawer-head">
      <h2 id="listen-title">Listen to this paper</h2>
      <button class="btn quiet" type="button" id="listen-close" aria-label="Close">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <section class="ls-section">
        <h3>Estimate</h3>
        <dl class="summary" id="ls-summary"><dt>Loading…</dt></dl>
      </section>

      <section class="ls-section">
        <h3>Text-to-speech options</h3>
        <div class="table-scroll">
          <table class="options-table">
            <thead>
              <tr><th>Option</th><th class="num">Chars</th><th class="num">Audio</th><th class="num">Cost</th><th class="num">Processing</th><th>Status</th></tr>
            </thead>
            <tbody id="ls-options"></tbody>
          </table>
        </div>
      </section>

      <section class="ls-section">
        <div class="ls-head">
          <h3>Voice</h3>
          <a class="small" id="ls-voicelab" href="/voices">Voice lab →</a>
        </div>
        <div class="form-rows">
          <div class="form-row">
            <label>Engine <select id="ls-engine"></select></label>
            <label id="ls-model-field" hidden>Model <select id="ls-model"></select></label>
          </div>
          <div class="form-row">
            <label class="grow">Voice <select id="ls-voice"></select></label>
            <label>Speed <select id="ls-speed"></select></label>
          </div>
        </div>
        <p class="note muted" id="ls-engine-note" hidden></p>
      </section>

      <section class="ls-section">
        <details class="try" id="ls-try">
          <summary><span class="try-title">Try voices</span> <span class="muted small">Kokoro · local and free</span></summary>
          <p class="muted small" id="ls-try-hint">Pick up to 6 voices. Each one reads the opening of this paper.</p>
          <div class="voice-grid" id="ls-try-voices"></div>
          <div class="try-actions">
            <button class="btn" type="button" id="ls-try-go" disabled>Render samples</button>
            <span class="muted small" id="ls-try-count"></span>
          </div>
          <div class="progress" id="ls-try-progress" hidden>
            <progress max="1" value="0"></progress>
            <p class="msg"></p>
          </div>
          <p class="error" id="ls-try-error" hidden></p>
          <ul class="samples" id="ls-samples"></ul>
        </details>
      </section>
    </div>

    <div class="drawer-foot">
      <p class="warning" id="ls-warning" role="alert" hidden></p>
      <p class="error" id="ls-error" role="alert" hidden></p>
      <div class="progress" id="ls-progress" hidden>
        <progress max="1" value="0"></progress>
        <p class="msg"></p>
      </div>
      <button class="btn primary accept" type="button" id="ls-accept" disabled>Loading estimate…</button>
    </div>
  </dialog>
</body>
</html>
